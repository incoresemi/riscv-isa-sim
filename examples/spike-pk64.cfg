# Spike config for use with proxy kernel (pk) — RV64
# pk requires standard memory at 0x80000000 with sufficient size

# --- Core ---
isa              = RV64IMAFDC_zicntr_zihpm
priv             = MSU
varch            = vlen:128,elen:64
processors       = 1

# --- Memory: pk needs a single large region at 0x80000000 ---
memory DRAM      = 0x80000000:0x10000000  # 256 MB

# --- Endianness ---
big_endian       = false

# --- Misaligned access ---
misaligned       = false

# --- PMP ---
pmpregions       = 16
pmpgranularity   = 4

# --- Cache block size ---
blocksz          = 64

# --- Triggers ---
triggers         = 4

# --- Device Tree ---
dtb_enabled      = true

# --- Logging ---
log              = false
log_commits      = false

# --- Debug mode ---
debug            = false
halted           = false

# --- Histogram (enable for instruction count comparison) ---
histogram        = false

# --- Real-time CLINT ---
real_time_clint  = false
