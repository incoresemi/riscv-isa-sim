# Spike RISC-V ISA Simulator Configuration
# Lines starting with '#' are comments
# Format: key = value

# --- Core ---
isa              = RV64IMAFDC_zicntr_zihpm
priv             = MSU
varch            = vlen:128,elen:64
processors       = 1
# hartids        = 0,1,2       # explicit hart IDs (omit to auto-assign 0..N-1)
# pc             = 0x80000000  # override ELF entry point

# --- Memory regions (from BlockDiagram_uArch.xlsx MemoryMap) ---
# Format: memory [NAME] = base:size  (hex, 4KiB aligned)
# NAME is optional, for readability only — Spike treats all regions as RAM.
#
# MEMORY SECTION (from BlockDiagram_uArch.xlsx MemoryMap)
# NOTE: Spike reserves 0x0000_0000..0x0200_BFFF for internal devices
#       (debug module, boot ROM, CLINT). ITCM is remapped to 0x20004000
#       for simulation. Real SoC uses 0x00000000.
memory ITCM_RAM       = 0x20004000:0x00004000  # 16 KB  — Instruction TCM (sim: remapped from 0x0)
memory DTCM_RAM       = 0x20000000:0x00004000  # 16 KB  — Data TCM
memory SRAM1           = 0x20010000:0x00010000  # 64 KB  — On-chip SRAM
memory ONCHIP_ROM     = 0x00200000:0x00004000  # 16 KB  — On-chip Boot ROM (simulated as RAM)
memory OFFCHIP_FLASH  = 0x80000000:0x00100000  # 1 MB   — Off-chip Flash (simulated as RAM)
memory OFFCHIP_PSRAM  = 0x60000000:0x00100000  # 1 MB   — Off-chip PSRAM

# --- Endianness ---
big_endian       = false

# --- Misaligned access ---
misaligned       = false

# --- PMP ---
pmpregions       = 16
pmpgranularity   = 4

# --- Cache (comment out to disable) ---
# Format: sets:ways:blocksize
# ic             = 64:4:64
# dc             = 64:4:64
# l2             = 128:8:64

# --- Cache block size for CMO operations (powers of 2, 16..4096) ---
blocksz          = 64

# --- Triggers ---
triggers         = 4

# --- Boot ---
# kernel         = /path/to/kernel
# initrd         = /path/to/initrd
# bootargs       = console=ttyS0 earlycon

# --- Device Tree ---
dtb_enabled      = true
# dtb            = /path/to/custom.dtb

# --- Debug Module ---
dm_progsize      = 2
dm_sba           = 0
dm_auth          = false
dm_abstract_rti  = 0
dm_hasel         = true
dm_abstract_csr  = true
dm_abstract_fpr  = true
dm_halt_groups   = true
dm_impebreak     = true

# --- Logging ---
log              = false
# log_file       = /path/to/spike.log
log_commits      = false
log_cache_miss   = false

# --- Debug mode ---
debug            = false
# debug_cmd      = /path/to/commands.txt
halted           = false

# --- Histogram ---
histogram        = false

# --- Real-time CLINT ---
real_time_clint  = false

# --- Extensions ---
# extension      = rocc_example
# extlib         = /path/to/libcustomext.so

# --- Devices ---
# device         = plugin_name,arg1,arg2

# --- Remote Bitbang ---
# rbb_port       = 9824
